# Deploy ke Azure App Service (Linux, Publish=Container).
#
# TIDAK ADA LANGKAH MIGRASI DI SINI. psq-bt-apps tidak punya endpoint publik,
# jadi runner GitHub tidak bisa menjangkaunya. Migrasi jalan dari entrypoint
# container lewat Application Setting RUN_MIGRATIONS=1.
#
# Aman HANYA selama app ini berjalan pada satu instance: Laravel tidak mengunci
# tabel migrations, jadi dua instance yang start bersamaan sama-sama mencoba.
# Sebelum scale out, migrasi harus pindah (runner di dalam VNet, atau container
# job sekali-jalan).
#
# Kegagalan migrasi tidak diam: entrypoint jalan di bawah `set -e`, container
# keluar, /up tidak pernah 200, dan gerbang health di bawah menggagalkan deploy.
#
# AUTENTIKASI: OIDC federation, bukan password tersimpan. Tidak ada kredensial
# registry maupun publish profile di repo ini -- admin user ACR dimatikan.
# Prasyarat sekali-saja: app registration + federated credential untuk repo ini,
# dengan peran AcrPush di acrbtapps dan Website Contributor di satu web app ini.

name: Deploy to Azure

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # wajib untuk OIDC; tanpa ini azure/login gagal

concurrency:
  group: deploy-vms-api
  cancel-in-progress: false

env:
  REGISTRY: acrbtapps.azurecr.io
  IMAGE: vms-api
  RESOURCE_GROUP: rg-init-bt-apps
  APP_NAME: as-api-vms-bt-apps

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to the registry
        run: az acr login --name acrbtapps

      # Tag pakai git sha, jangan pernah `latest`: restart App Service menarik
      # ulang tag yang dikonfigurasi, dan `latest` yang bergerak akan mengubah
      # apa yang berjalan tanpa deploy. Tag `production` cuma penunjuk untuk
      # manusia -- app selalu diarahkan ke sha.
      - name: Build image
        run: |
          docker build \
            --tag $REGISTRY/$IMAGE:${{ github.sha }} \
            --tag $REGISTRY/$IMAGE:production \
            .

      - name: Push image
        run: |
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:production

      - name: Point the app at the new image
        run: |
          az webapp config container set \
            --resource-group $RESOURCE_GROUP \
            --name $APP_NAME \
            --container-image-name $REGISTRY/$IMAGE:${{ github.sha }}

      # Perintah di atas kembali sebelum container baru melayani, jadi polling.
      # Ini sekaligus gerbang migrasi: migrasi gagal membuat /up tidak pernah
      # 200 dan job ini gagal di sini.
      - name: Wait for the new container to serve /up
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://$APP_NAME.azurewebsites.net/up || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after $((i * 10))s"
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::App tidak mengembalikan 200 di /up dalam 5 menit."
          echo "::error::Lihat 'az webapp log tail' -- migrasi gagal terlihat seperti ini."
          exit 1

      # Sengaja tanpa rollback otomatis. Saat gerbang health gagal, migrasi
      # biasanya sudah jalan; mengembalikan image tanpa mengembalikan skema
      # meninggalkan kode lama di atas skema baru -- umumnya lebih buruk dari
      # kegagalan yang mau dipulihkan. Baca log dulu, baru rollback manual:
      #
      #   az webapp config container set -g rg-init-bt-apps \
      #     -n as-api-vms-bt-apps \
      #     --container-image-name acrbtapps.azurecr.io/vms-api:<sha-sebelumnya>
      - name: Deployment summary
        if: always()
        run: |
          echo "### as-api-vms-bt-apps" >> $GITHUB_STEP_SUMMARY
          echo "- image: \`$IMAGE:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- app: \`$APP_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
