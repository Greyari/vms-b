# ==============================================================================
# VMS Apache 2.4 Lounge Production VirtualHost Configuration
# Target: Windows 11 Pro 64-bit (Offline Shipyard LAN)
# Spec Reference: 2026-09-13-vms-local-server-parity-design.md (§2.2, §2.3, §2.4, §2.6)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PHP 8.4 Module Handler Configuration
# ------------------------------------------------------------------------------
LoadModule php_module "C:/VMS/php/php8apache2_4.dll"
PHPIniDir "C:/VMS/php"
AddType application/x-httpd-php .php
DirectoryIndex index.php index.html

# ------------------------------------------------------------------------------
# 2. Port 80 HTTP VirtualHost (Enforce HTTPS via Permanent Redirect)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName vms.asl.local
    ServerAlias localhost

    # Unconditional redirect to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    Redirect permanent / https://%{HTTP_HOST}/
</VirtualHost>

# ------------------------------------------------------------------------------
# 3. Port 443 HTTPS VirtualHost (Primary VMS Production Service)
# ------------------------------------------------------------------------------
# httpd.conf of Apache Lounge only opens port 80; its `Listen 443` sits in
# conf/extra/httpd-ssl.conf, which must NOT be included next to this file
# (a second `Listen 443` stops Apache from starting). Without this line nothing
# answers on 443: "curl: (7) Failed to connect to 127.0.0.1 port 443".
Listen 443

<VirtualHost *:443>
    ServerName vms.asl.local
    ServerAlias localhost

    DocumentRoot "C:/VMS/app/public"

    # SSL / TLS Engine Configuration
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off

    # Internal Certificate Chain
    SSLCertificateFile "C:/VMS/certs/vms-server.crt"
    SSLCertificateKeyFile "C:/VMS/certs/vms-server.key"
    SSLCACertificateFile "C:/VMS/certs/vms-root-ca.crt"

    # Application Directory Permissions
    <Directory "C:/VMS/app/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # Security Headers (§2.6)
    # --------------------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    # --------------------------------------------------------------------------
    # SPA Shell Cache-Control (Roadmap & §2.3)
    # Prevent caching of index.html so frontend asset updates take effect immediately
    # --------------------------------------------------------------------------
    <Files "index.html">
        Header set Cache-Control "no-store, no-cache, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires 0
    </Files>

    # Logging
    ErrorLog "C:/VMS/Apache24/logs/vms_error.log"
    CustomLog "C:/VMS/Apache24/logs/vms_access.log" combined
</VirtualHost>
