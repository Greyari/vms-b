[PHP]
; ==============================================================================
; VMS PHP 8.4 Thread Safe Production Configuration
; Target: Windows 11 Pro 64-bit (Offline Shipyard LAN)
; Spec Reference: 2026-09-13-vms-local-server-parity-design.md (§2.2, §2.5)
; ==============================================================================

; Resource Limits
memory_limit = 512M
max_execution_time = 300
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 32M
default_socket_timeout = 60

; Error Reporting (Production Cleanliness)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = "C:/VMS/php/logs/php_errors.log"

; Regional Settings
date.timezone = Asia/Jakarta

; File Uploads & Paths
file_uploads = On
upload_tmp_dir = "C:/VMS/php/temp"
sys_temp_dir = "C:/VMS/php/temp"

; Dynamic Extensions (Windows x64)
extension_dir = "ext"

extension=pdo_pgsql
extension=pgsql
extension=intl
extension=zip
extension=gd
extension=mbstring
extension=openssl
extension=fileinfo
extension=curl

; OPcache Settings for Production
[opcache]
zend_extension=opcache
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
