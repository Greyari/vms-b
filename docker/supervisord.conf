[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:scheduler]
command=php /var/www/html/artisan schedule:work
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Queue worker. QUEUE_CONNECTION is `database` in every environment, so without
; a worker anything dispatched with ShouldQueue is written to the jobs table and
; then sits there forever -- no error, no log line, just mail that never arrives.
;
; --max-time=3600 makes the worker exit hourly and be restarted by supervisor.
; A long-lived worker keeps the container's booted application in memory, so a
; deploy or an App Setting change is otherwise invisible to it until restart.
;
; stopwaitsecs gives an in-flight job time to finish before supervisor escalates
; to SIGKILL on shutdown; queue:work already stops accepting new work on SIGTERM.
[program:queue]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
