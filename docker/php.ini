memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
expose_php = Off

; Impor pengunjung dan ekspor PDF melewati batas 30 detik bawaan PHP dan mati
; sebagai 502 tanpa pesan. Nilai ini di bawah timeout FastCGI nginx supaya galat
; PHP yang muncul, bukan galat proksi.
max_execution_time = 110
max_input_time = 110
